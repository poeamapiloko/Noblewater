<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Noble Water Chatbot</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif}

  /* Floating button */
  #nw-fab{
    position:fixed;bottom:24px;right:24px;z-index:9999;
    display:flex;align-items:center;gap:10px;
    background:#0a3d2e;color:#fff;border:none;border-radius:50px;
    padding:14px 22px;font-size:14px;font-weight:500;cursor:pointer;
    box-shadow:0 4px 20px rgba(10,61,46,0.4);
    transition:transform 0.2s,box-shadow 0.2s;
  }
  #nw-fab:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(10,61,46,0.5)}
  #nw-fab .live-dot{
    width:9px;height:9px;border-radius:50%;background:#4ade80;
    animation:pulse 1.8s infinite;flex-shrink:0;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

  /* Chat panel */
  #nw-panel{
    position:fixed;bottom:88px;right:24px;z-index:9998;
    width:360px;max-height:580px;border-radius:16px;
    background:#fff;box-shadow:0 8px 40px rgba(0,0,0,0.18);
    display:none;flex-direction:column;overflow:hidden;
    border:1px solid #e2e8f0;
  }
  @media(max-width:420px){
    #nw-panel{width:calc(100vw - 20px);right:10px;bottom:80px}
    #nw-fab{right:16px;bottom:16px}
  }

  /* Header */
  #nw-header{
    background:#0a3d2e;padding:14px 16px;
    display:flex;align-items:center;gap:11px;flex-shrink:0;
  }
  .nw-logo{
    width:38px;height:38px;border-radius:50%;background:#1a6b50;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;color:#a8f5d8;flex-shrink:0;
    letter-spacing:0.5px;
  }
  .nw-hname{font-size:14px;font-weight:600;color:#fff;line-height:1.2}
  .nw-hstatus{font-size:11px;color:#7effc4;margin-top:2px}
  #nw-close{
    margin-left:auto;background:none;border:none;color:#a8f5d8;
    cursor:pointer;font-size:18px;padding:4px;line-height:1;
  }
  #nw-close:hover{color:#fff}

  /* Messages */
  #nw-msgs{
    flex:1;overflow-y:auto;padding:14px 12px;
    display:flex;flex-direction:column;gap:10px;
    background:#f0faf5;min-height:200px;
  }
  #nw-msgs::-webkit-scrollbar{width:4px}
  #nw-msgs::-webkit-scrollbar-track{background:transparent}
  #nw-msgs::-webkit-scrollbar-thumb{background:#c8e6d9;border-radius:4px}

  .nw-msg{display:flex;gap:7px;align-items:flex-end;max-width:92%}
  .nw-msg.bot{align-self:flex-start}
  .nw-msg.user{align-self:flex-end;flex-direction:row-reverse}
  .nw-av{
    width:26px;height:26px;border-radius:50%;background:#0a3d2e;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;color:#a8f5d8;font-weight:600;flex-shrink:0;
  }
  .nw-bubble{
    padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.55;
  }
  .nw-msg.bot .nw-bubble{
    background:#fff;border:1px solid #d4edda;
    color:#1a2e25;border-bottom-left-radius:3px;
  }
  .nw-msg.user .nw-bubble{
    background:#0a3d2e;color:#fff;border-bottom-right-radius:3px;
  }
  .nw-bubble b{font-weight:600}

  /* Typing indicator */
  .nw-typing{display:flex;gap:4px;padding:9px 12px;align-items:center}
  .nw-typing span{
    width:6px;height:6px;border-radius:50%;background:#94c5a8;
    animation:nbounce 1.2s infinite;
  }
  .nw-typing span:nth-child(2){animation-delay:.2s}
  .nw-typing span:nth-child(3){animation-delay:.4s}
  @keyframes nbounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

  /* Quick replies */
  #nw-qr{
    display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;
    background:#fff;border-top:1px solid #e8f5ee;
  }
  .nw-qr-btn{
    font-size:11px;padding:5px 10px;border-radius:20px;cursor:pointer;
    border:1px solid #b8ddc9;background:#f0faf5;
    color:#0a3d2e;white-space:nowrap;
    transition:background 0.12s,border-color 0.12s;
  }
  .nw-qr-btn:hover{background:#d4edda;border-color:#0a3d2e}

  /* Input */
  #nw-inp-row{
    display:flex;gap:8px;padding:10px 12px;
    border-top:1px solid #e8f5ee;background:#fff;flex-shrink:0;
  }
  #nw-txt{
    flex:1;border:1px solid #c8e6d9;border-radius:20px;
    padding:8px 14px;font-size:13px;outline:none;
    background:#f8fdfb;color:#1a2e25;
    transition:border-color 0.15s;
  }
  #nw-txt:focus{border-color:#0a3d2e}
  #nw-snd{
    width:34px;height:34px;border-radius:50%;background:#0a3d2e;
    border:none;cursor:pointer;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;transition:background 0.15s,transform 0.15s;
  }
  #nw-snd:hover{background:#0d5240;transform:scale(1.05)}
  #nw-snd svg{fill:#fff;width:14px;height:14px}

  /* Slide-up animation */
  @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  #nw-panel.open{animation:slideUp 0.25s ease forwards}
</style>
</head>
<body>

<!-- Floating chat button -->
<button id="nw-fab" onclick="nwToggle()" aria-label="Open Noble Water chat">
  <span class="live-dot"></span>
  <span id="nw-fab-label">Chat with us</span>
</button>

<!-- Chat panel -->
<div id="nw-panel" role="dialog" aria-label="Noble Water support chat">
  <div id="nw-header">
    <div class="nw-logo">NW</div>
    <div>
      <div class="nw-hname">Noble Water Support</div>
      <div class="nw-hstatus">&#9679; Online — replies instantly</div>
    </div>
    <button id="nw-close" onclick="nwToggle()" aria-label="Close chat">&#10005;</button>
  </div>
  <div id="nw-msgs"></div>
  <div id="nw-qr"></div>
  <div id="nw-inp-row">
    <input id="nw-txt" type="text" placeholder="Ask about Noble Water..." onkeydown="if(event.key==='Enter')nwSend()" aria-label="Type your message"/>
    <button id="nw-snd" onclick="nwSend()" aria-label="Send message">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  var QA=[
    {k:["hello","hi","hey","good morning","good day","howzit","greetings","start","sup"],
     a:"Welcome to <b>Noble Water</b> — the taste of prestige! I'm here to help with products, pricing, delivery and orders. What can I help you with today?",
     qr:["Our products","Pricing","Free delivery","Place an order","Contact us"]},

    {k:["product","offer","range","size","what do you sell","what water","which bottle","available"],
     a:"We offer 6 sizes of ultra-purified pH 7.5 mineral water:<br><br>&#8226; <b>Sachet</b> — on-the-go hydration<br>&#8226; <b>350 ml</b> — pocket size for school &amp; gym<br>&#8226; <b>500 ml</b> — our best-selling everyday bottle<br>&#8226; <b>1.5 L</b> — great for families &amp; restaurants<br>&#8226; <b>5 L</b> — bulk for offices &amp; events<br>&#8226; <b>10 L</b> — XL for large offices &amp; construction",
     qr:["Sachet info","500 ml bottle","5 L bulk","10 L XL","Place an order"]},

    {k:["sachet","satchet","packet"],
     a:"Our sachets are pure purified water — ideal for everyday hydration on the go. Perfect for schools, churches, events and reselling. Would you like to place a bulk sachet order?",
     qr:["Place an order","Pricing","Delivery info"]},

    {k:["350","350ml","mini","pocket"],
     a:"Our 350 ml mini bottle is the perfect pocket-sized companion for school, the gym, or a quick refreshment. Lightweight and easy to carry.",
     qr:["Place an order","Pricing","Best seller"]},

    {k:["500","500ml","standard","best seller","popular","most popular"],
     a:"The 500 ml Standard Bottle is our <b>best seller</b> and everyday hydration companion — perfectly sized, clean and refreshing. Most of our individual customers choose this one!",
     qr:["Place an order","Pricing","Other sizes"]},

    {k:["1.5","1.5l","family","household","restaurant"],
     a:"Our 1.5 L Family Bottle is great for households, restaurants, and sharing around the table. Many restaurant partners order these regularly with free delivery.",
     qr:["Place an order","Restaurant orders","Delivery info"]},

    {k:["5 l","5l","5 liter","5 litre","bulk","office","events"],
     a:"The 5 L Bulk Container is perfect for offices, events, and home use. We offer free delivery for bulk orders of 5+ cases — great value for high-volume hydration.",
     qr:["Place an order","10 L XL","Delivery info","Pricing"]},

    {k:["10 l","10l","10 liter","10 litre","xl","large","construction","big"],
     a:"The 10 L XL Container is our largest option — ideal for large offices, construction sites, and big events. Maximum hydration at maximum value.",
     qr:["Place an order","Pricing","Delivery info"]},

    {k:["price","cost","how much","pricing","rate","charge","fee","afford"],
     a:"Our pricing is competitive and tailored to your order size. For the latest prices and bulk discounts, reach out directly:<br><br>&#8226; <b>WhatsApp:</b> +266 56910125<br>&#8226; <b>Call:</b> +266 69434952<br>&#8226; <b>Email:</b> noblewaterls@outlook.com<br><br>We'll give you the best deal for your volume!",
     qr:["WhatsApp order","Bulk discount","Place an order"]},

    {k:["wholesale","bulk price","bulk discount","bulk order","bulk pricing","minimum order","minimum quantity"],
     a:"Yes! We offer wholesale and bulk pricing for large orders. The more you order, the better the price. Contact us on WhatsApp at <b>+266 56910125</b> for a custom bulk quote.",
     qr:["WhatsApp order","Call us","Delivery info"]},

    {k:["discount","deal","offer","cheaper","reduce","negotiable","special"],
     a:"We offer discounts for regular customers, large bulk orders, and institutional clients like schools, hospitals and offices. WhatsApp us at <b>+266 56910125</b> to discuss your needs.",
     qr:["WhatsApp order","Bulk order","Place an order"]},

    {k:["deliver","delivery","shipping","ship","dispatch","area","where do you deliver","maseru","surrounding"],
     a:"We offer <b>free local delivery</b> across Maseru and surrounding areas for orders of 5+ cases. Your order is freshly bottled, sealed and dispatched same-day or within 2 business days.",
     qr:["How to order","Place an order","Contact us"]},

    {k:["free delivery","no delivery charge","delivery free","cost of delivery"],
     a:"Yes! Delivery is <b>completely free</b> within Maseru and surrounding areas for orders of 5+ cases. Pure Noble Water arrives fresh at your door — no hidden charges.",
     qr:["Place an order","How to order"]},

    {k:["how long","delivery time","how fast","same day","2 days","when will","how soon"],
     a:"We dispatch same-day or within 2 business days for local Maseru orders. Once dispatched, your Noble Water arrives fresh and ready to drink.",
     qr:["Place an order","Delivery area","Contact us"]},

    {k:["order","how to order","how do i order","buy","purchase","get water","want water"],
     a:"Ordering is simple! You can:<br><br>1. <b>WhatsApp us</b> at +266 56910125<br>2. <b>Call us</b> at +266 69434952<br>3. <b>Fill the contact form</b> on our website<br>4. <b>Email us</b> at noblewaterls@outlook.com<br><br>Just tell us which product and quantity you need — we handle the rest!",
     qr:["WhatsApp order","Call us","Custom branded bottles"]},

    {k:["whatsapp","whats app","wa","chat order"],
     a:"WhatsApp us directly at <b>+266 56910125</b> to place your order, get a quote, or ask any questions. We respond quickly!",
     qr:["Place an order","Get a quote","Custom branding"]},

    {k:["recurring","regular","weekly","monthly","subscription","standing order"],
     a:"Absolutely! Many of our clients set up regular weekly or monthly delivery schedules. Contact us on WhatsApp <b>+266 56910125</b> and we'll arrange a standing order that suits you.",
     qr:["WhatsApp order","Bulk pricing","Contact us"]},

    {k:["custom","branded","logo","label","my brand","corporate gift","event bottle","hotel","gifting"],
     a:"Yes! We offer <b>custom branded bottles</b> with your logo — perfect for events, hotels, restaurants, and corporate gifting. We handle both design and printing. Just reach out and tell us your vision!",
     qr:["Custom branding inquiry","How many for custom?","Contact us"]},

    {k:["minimum","minimum order custom","minimum branding","how many custom"],
     a:"Minimum quantities for custom branded bottles depend on the bottle size chosen. Contact us on WhatsApp <b>+266 56910125</b> or email noblewaterls@outlook.com for exact minimums and pricing.",
     qr:["WhatsApp order","Custom branded bottles","Contact us"]},

    {k:["design","my logo","who designs","bring my logo","design custom","artwork"],
     a:"We handle the design and printing for custom orders! If you have an existing logo, just send it to us and we'll incorporate it. Our team ensures your brand looks great on the bottle.",
     qr:["Custom branding inquiry","WhatsApp order","Contact us"]},

    {k:["payment","how to pay","pay","mobile money","mpesa","ecocash","cash","invoice","account"],
     a:"We accept various payment methods including cash on delivery and mobile money. Corporate clients may arrange payment on account/invoice. Contact us at <b>+266 56910125</b> for details.",
     qr:["Place an order","Contact us","WhatsApp order"]},

    {k:["ph","alkaline","7.5","balanced","alkalinity","alkaline water"],
     a:"Noble Water has a perfectly balanced pH of <b>7.5</b> — slightly alkaline, which supports hydration, digestion, and everyday wellness. Clean, fresh and great for your body.",
     qr:["Purification process","Water quality","Place an order"]},

    {k:["purif","reverse osmosis","uv","treatment","how is it made","process","filtration","filter","stage"],
     a:"Every drop of Noble Water goes through a rigorous <b>multi-stage purification process</b>:<br><br>&#8226; Reverse osmosis filtration<br>&#8226; UV treatment<br>&#8226; Mineral balancing<br><br>Result: 0 PPM heavy metals, 99.9% pure, pH-balanced water.",
     qr:["pH info","Safe for babies?","Place an order"]},

    {k:["safe","quality","heavy metal","ppm","clean","pure","trust","certified"],
     a:"Noble Water is <b>99.9% purified</b> with 0 PPM heavy metals. Our multi-stage purification — reverse osmosis, UV treatment, and mineral balancing — ensures every bottle is safe and great-tasting.",
     qr:["Purification process","pH info","Place an order"]},

    {k:["baby","babies","infant","child","kids","safe for baby","toddler"],
     a:"Noble Water is ultra-purified with 0 PPM heavy metals and pH 7.5 — a great choice for the whole family. As always, consult your paediatrician for specific infant dietary guidance.",
     qr:["Water quality","pH info","Place an order"]},

    {k:["gym","sport","athlete","exercise","workout","fitness","active"],
     a:"Our 350 ml and 500 ml bottles are perfect for the gym and sports — lightweight, pure and refreshing. The pH 7.5 balance supports optimal hydration during exercise.",
     qr:["350 ml bottle","500 ml bottle","Place an order"]},

    {k:["cook","cooking","food","kitchen","tea","coffee"],
     a:"Yes! Noble Water's purity and balanced pH make it excellent for cooking, tea, coffee, and any food preparation where water quality matters.",
     qr:["Water quality","Place an order"]},

    {k:["elderly","old people","senior","health benefit","health"],
     a:"Noble Water's 0 PPM heavy metals and pH 7.5 balance make it a healthy choice for people of all ages, including the elderly. Clean, mineral-balanced water supports everyday wellness.",
     qr:["Water quality","Place an order","Delivery info"]},

    {k:["corporate","office supply","offices","institution","hospital","school supply","company","business"],
     a:"We supply offices, corporations, schools, hospitals and institutions across Maseru. We offer bulk pricing, regular delivery schedules, and custom branded options for corporate clients.",
     qr:["Bulk pricing","Custom branding","WhatsApp order"]},

    {k:["restaurant","hotel","catering","hospitality","lodge"],
     a:"Noble Water is a popular choice for restaurants, hotels and catering businesses. We offer the 1.5 L family bottle and custom branded options with reliable free delivery. Many hospitality clients have standing orders.",
     qr:["Custom branding","1.5 L bottle","Place an order"]},

    {k:["event","function","party","conference","wedding","occasion"],
     a:"Noble Water is perfect for events! We supply sachets, bottles, and bulk containers for conferences, weddings, parties and corporate functions. Custom branded bottles for events are also available.",
     qr:["Custom branding","Bulk order","Place an order"]},

    {k:["where","location","office","address","based","find you","lesotho","maseru"],
     a:"Noble Water is proudly based in <b>Maseru, Lesotho</b>. We serve Maseru and surrounding areas with free local delivery.",
     qr:["Contact us","Delivery area","Place an order"]},

    {k:["local","lesotho brand","proudly local","made in lesotho","lesotho product"],
     a:"Yes! Noble Water is a <b>proudly local Lesotho brand</b> based in Maseru. We produce our water right here and deliver across the region. Supporting local never tasted this good!",
     qr:["Our products","Place an order","Contact us"]},

    {k:["contact","reach","phone","call","email","get in touch","speak"],
     a:"You can reach Noble Water through any of these channels:<br><br>&#8226; <b>WhatsApp:</b> +266 56910125<br>&#8226; <b>Call:</b> +266 69434952<br>&#8226; <b>Email:</b> noblewaterls@outlook.com<br>&#8226; <b>Location:</b> Maseru, Lesotho",
     qr:["WhatsApp order","Place an order","Our products"]},
  ];

  var DEFAULT_QR=["Our products","Pricing","Free delivery","Custom branding","Contact us"];

  function getReply(msg){
    var lc=msg.toLowerCase();
    for(var i=0;i<QA.length;i++){
      var qa=QA[i];
      for(var j=0;j<qa.k.length;j++){
        if(lc.indexOf(qa.k[j])>-1) return qa;
      }
    }
    return{a:"Thanks for your message! For the quickest response, please WhatsApp us at <b>+266 56910125</b> or call <b>+266 69434952</b>. We're happy to help!",qr:DEFAULT_QR};
  }

  var isOpen=false;
  window.nwToggle=function(){
    isOpen=!isOpen;
    var panel=document.getElementById('nw-panel');
    var label=document.getElementById('nw-fab-label');
    if(isOpen){
      panel.style.display='flex';
      panel.classList.add('open');
      label.textContent='Close chat';
      if(document.getElementById('nw-msgs').children.length===0){
        setTimeout(function(){
          addBot("Welcome to <b>Noble Water</b> — the taste of prestige! I'm here to help with products, pricing, delivery and orders. What would you like to know?");
          setQR(DEFAULT_QR);
        },350);
      }
    } else {
      panel.style.display='none';
      panel.classList.remove('open');
      label.textContent='Chat with us';
    }
  };

  function addBot(html){
    var w=document.getElementById('nw-msgs');
    var d=document.createElement('div');
    d.className='nw-msg bot';
    d.innerHTML='<div class="nw-av">NW</div><div class="nw-bubble">'+html+'</div>';
    w.appendChild(d);w.scrollTop=w.scrollHeight;
  }
  function addUser(txt){
    var w=document.getElementById('nw-msgs');
    var d=document.createElement('div');
    d.className='nw-msg user';
    d.innerHTML='<div class="nw-bubble">'+escHtml(txt)+'</div>';
    w.appendChild(d);w.scrollTop=w.scrollHeight;
  }
  function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function showTyping(){
    var w=document.getElementById('nw-msgs');
    var d=document.createElement('div');
    d.className='nw-msg bot';d.id='nw-typ';
    d.innerHTML='<div class="nw-av">NW</div><div class="nw-bubble"><div class="nw-typing"><span></span><span></span><span></span></div></div>';
    w.appendChild(d);w.scrollTop=w.scrollHeight;
  }
  function hideTyping(){var t=document.getElementById('nw-typ');if(t)t.remove();}
  function setQR(items){
    var r=document.getElementById('nw-qr');r.innerHTML='';
    (items||DEFAULT_QR).forEach(function(label){
      var b=document.createElement('button');
      b.className='nw-qr-btn';b.textContent=label;
      b.onclick=function(){dispatch(label);};
      r.appendChild(b);
    });
  }
  window.nwSend=function(){
    var i=document.getElementById('nw-txt');
    var v=i.value.trim();if(!v)return;
    i.value='';dispatch(v);
  };
  function dispatch(txt){
    addUser(txt);
    document.getElementById('nw-qr').innerHTML='';
    showTyping();
    setTimeout(function(){
      hideTyping();
      var r=getReply(txt);
      addBot(r.a);
      setQR(r.qr);
    },800+Math.random()*400);
  }
})();
</script>
</body>
</html>
